name: Build Dead Rose OS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  installer-iso:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print runner information
        run: |
          set -euo pipefail
          uname -a
          uname -m
          cat /etc/os-release

      - name: Print available disk space
        run: |
          set -euo pipefail
          df -h
          lsblk

      - name: Bootstrap build environment
        run: ./dr bootstrap --ci

      - name: Run repository quality checks
        run: ./dr test

      - name: Build Ubuntu root filesystem payload
        run: DEAD_ROSE_TEST_MARKERS=1 ./dr build

      - name: Build installer ISO
        run: |
          set -euo pipefail
          DEAD_ROSE_TEST_MARKERS=1 ./dr iso 2>&1 | tee build/logs/build-iso-full.log

      - name: Smoke-test installer boot
        run: ./dr installer-vm --smoke

      - name: Report installer smoke markers
        if: always()
        run: |
          set -euo pipefail
          installer_log="build/logs/boot/installer-serial.log"
          installed_log="build/logs/boot/installed-serial.log"
          marker_state() {
            local marker="$1"
            local log="$2"
            if [[ -f "$log" ]] && rg -q "$marker" "$log"; then
              printf yes
            else
              printf no
            fi
          }
          last_phase="$(rg -o 'DEAD_ROSE_INSTALL_PROGRESS [a-z_]+' "$installer_log" 2>/dev/null | tail -n 1 | cut -d' ' -f2 || true)"
          last_phase="${last_phase:-none}"
          failed_units="$(rg -o 'DEAD_ROSE_FAILED_UNIT [a-zA-Z0-9@_.-]+' "$installer_log" 2>/dev/null | cut -d' ' -f2 | sort -u | paste -sd, - || true)"
          failed_units="${failed_units:-none}"
          unit_states="$(rg -o 'DEAD_ROSE_UNIT_STATE [a-zA-Z0-9@_.-]+ (active|activating|deactivating|inactive|failed|unknown)' "$installer_log" 2>/dev/null | sed 's/^DEAD_ROSE_UNIT_STATE //' | sort -u | paste -sd, - || true)"
          unit_states="${unit_states:-none}"
          process_states="$(rg -o 'DEAD_ROSE_PROCESS_STATE (session|cage|installer|backend) (yes|no)' "$installer_log" 2>/dev/null | sed 's/^DEAD_ROSE_PROCESS_STATE //' | sort -u | paste -sd, - || true)"
          process_states="${process_states:-none}"
          grub_ready="$(marker_state DEAD_ROSE_GRUB_READY "$installer_log")"
          initrd_ready="$(marker_state DEAD_ROSE_INITRD_READY "$installer_log")"
          live_root_ready="$(marker_state DEAD_ROSE_LIVE_ROOT_READY "$installer_log")"
          ui_ready="$(marker_state DEAD_ROSE_INSTALLER_UI_READY "$installer_log")"
          install_complete="$(marker_state DEAD_ROSE_INSTALL_COMPLETE "$installer_log")"
          shell_ready="$(marker_state DEAD_ROSE_SHELL_READY "$installed_log")"
          summary="GRUB: $grub_ready; initrd: $initrd_ready; live root: $live_root_ready; UI: $ui_ready; install complete: $install_complete; installed shell: $shell_ready; last phase: $last_phase; failed units: $failed_units; unit states: $unit_states; processes: $process_states"
          echo "::notice title=Dead Rose installer smoke::$summary"
          {
            echo "## Installer smoke"
            echo
            echo "- GRUB reached: $grub_ready"
            echo "- Initrd reached: $initrd_ready"
            echo "- Live root ready: $live_root_ready"
            echo "- UI ready: $ui_ready"
            echo "- Install complete: $install_complete"
            echo "- Installed shell ready: $shell_ready"
            echo "- Last install phase: $last_phase"
            echo "- Failed units: $failed_units"
            echo "- Unit states: $unit_states"
            echo "- Process states: $process_states"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild release artifacts without smoke instrumentation
        run: |
          ./dr build
          ./dr iso

      - name: Upload build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-rose-os-diagnostics-${{ github.sha }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Print build contents and sizes
        continue-on-error: true
        run: |
          set -euo pipefail
          # mkosi creates root-owned paths. This is diagnostic only, so keep
          # it from blocking ISO verification/upload and limit log volume.
          sudo du -ahx build | sort -h | tail -n 100
          df -h .

      - name: Verify installer ISO
        id: installer
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          iso="build/dead-rose-os-${version}-amd64.iso"
          checksum="${iso}.sha256"

          if [[ ! -s "$iso" ]]; then
            echo "Expected installer ISO was not produced: $iso" >&2
            exit 1
          fi

          if [[ ! -s "$checksum" ]]; then
            echo "Expected installer checksum was not produced: $checksum" >&2
            exit 1
          fi

          sha256sum --check "$checksum"
          iso_size="$(stat -c %s "$iso")"
          iso_sha256="$(sha256sum "$iso" | awk '{print $1}')"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "size=$iso_size" >> "$GITHUB_OUTPUT"
          echo "sha256=$iso_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "## Release artifact"
            echo
            echo "- ISO: $(basename "$iso")"
            echo "- Size: $iso_size bytes"
            echo "- SHA-256: $iso_sha256"
            echo "- Artifact: dead-rose-os-amd64-${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Dead Rose OS ISO::$(basename "$iso"); $iso_size bytes; SHA-256 $iso_sha256"

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: dead-rose-os-amd64-${{ github.sha }}
          path: |
            ${{ steps.installer.outputs.iso }}
            ${{ steps.installer.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
