name: Dead Rose OS Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: dead-rose-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      ubuntu_version: ${{ steps.metadata.outputs.ubuntu_version }}
      kairos_init_version: ${{ steps.metadata.outputs.kairos_init_version }}
      auroraboot_version: ${{ steps.metadata.outputs.auroraboot_version }}
      rust_version: ${{ steps.metadata.outputs.rust_version }}
      node_version: ${{ steps.metadata.outputs.node_version }}
      pnpm_version: ${{ steps.metadata.outputs.pnpm_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag and export versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          project_version=$(tr -d '[:space:]' < VERSION)
          [[ "$GITHUB_REF_NAME" == "v${project_version}" ]]
          [[ "$UBUNTU_VERSION" == "26.04" ]]
          [[ "$KAIROS_INIT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$AURORABOOT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "ubuntu_version=${UBUNTU_VERSION}"
            echo "kairos_init_version=${KAIROS_INIT_VERSION}"
            echo "auroraboot_version=${AURORABOOT_VERSION}"
            echo "rust_version=${RUST_VERSION}"
            echo "node_version=${NODE_VERSION}"
            echo "pnpm_version=${PNPM_VERSION}"
          } >> "$GITHUB_OUTPUT"

  factory:
    needs: metadata
    # The pinned upstream workflow declares these permissions at job scope.
    permissions:
      contents: write
      packages: write
      actions: read
      security-events: write
      id-token: write
    # Kairos Factory reusable workflow — pinned commit, post-monorepo migration
    uses: kairos-io/kairos/.github/workflows/reusable-factory.yaml@911d4e3fef31ba9bf85923fc846470a0a3d68e2b
    with:
      dockerfile_path: os/Dockerfile
      version: ${{ needs.metadata.outputs.version }}
      base_image: ubuntu:26.04
      model: generic
      arch: amd64
      iso: true
      raw: false
      trusted_boot: false
      compute_checksums: true
      summary_artifacts: true
      auroraboot_version: ${{ needs.metadata.outputs.auroraboot_version }}
      cloud_config: os/cloud-config/default.yaml
      build_args: |
        UBUNTU_VERSION=${{ needs.metadata.outputs.ubuntu_version }}
        KAIROS_INIT_VERSION=${{ needs.metadata.outputs.kairos_init_version }}
        RUST_VERSION=${{ needs.metadata.outputs.rust_version }}
        NODE_VERSION=${{ needs.metadata.outputs.node_version }}
        PNPM_VERSION=${{ needs.metadata.outputs.pnpm_version }}
      registry_domain: ghcr.io
      registry_namespace: dead-rose-labs
      registry_repository: dead-rose-os
      custom_tag_format: 'candidate-$COMMIT_SHA'
      custom_artifact_format: 'dead-rose-os-$VERSION-$ARCH'
      # Grype runs in the report-only job below. Factory's pinned scanner action
      # aborts on scanner runtime errors before it can generate the ISO.
      grype: false
      trivy: true
      security_scan_mode: report-only
      sbom: true
      release: false
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}

  grype-report:
    needs: factory
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/grype-report.yml
    with:
      image: ghcr.io/dead-rose-labs/dead-rose-os:candidate-${{ github.sha }}
      registry_username: ${{ github.actor }}
    secrets:
      registry_password: ${{ secrets.GITHUB_TOKEN }}

  acceptance:
    needs:
      - metadata
      - factory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dead-rose-os-*.iso.zip
          path: artifacts
          merge-multiple: true
      - name: Verify the single Factory ISO and checksum
        id: artifact
        run: scripts/prepare-factory-artifact.sh artifacts
      - name: Install QEMU UEFI tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf genisoimage
      - name: Enable KVM acceleration when available
        run: if [[ -e /dev/kvm ]]; then sudo chmod 0666 /dev/kvm; fi
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidate OCI filesystem
        run: ./dr test-image --image "ghcr.io/dead-rose-labs/dead-rose-os:candidate-${GITHUB_SHA}"
      - name: Boot Factory ISO in UEFI live mode
        run: ./dr test-qemu live --iso "${{ steps.artifact.outputs.iso }}"
      - name: Install the same Factory ISO and verify persistence
        run: ./dr test-install --iso "${{ steps.artifact.outputs.iso }}" --config os/cloud-config/ci-install.yaml
      - name: Upload QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dead-rose-qemu-diagnostics-${{ github.sha }}
          path: build/qemu-*.log
          if-no-files-found: warn

  publish:
    needs:
      - metadata
      - factory
      - grype-report
      - acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dead-rose-os-*.iso.zip
          path: artifacts
          merge-multiple: true
      - name: Verify and normalize tested release artifact
        id: artifact
        shell: bash
        run: |
          scripts/prepare-factory-artifact.sh artifacts
          source_iso=$(find artifacts -type f -name '*.iso' -print -quit)
          release_iso="artifacts/dead-rose-os-${GITHUB_REF_NAME}-amd64.iso"
          mv "$source_iso" "$release_iso"
          sha256sum "$release_iso" > "${release_iso}.sha256"
          echo "iso=${release_iso}" >> "$GITHUB_OUTPUT"
          echo "checksum=${release_iso}.sha256" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested candidate OCI without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          candidate="ghcr.io/dead-rose-labs/dead-rose-os:candidate-${GITHUB_SHA}"
          production="ghcr.io/dead-rose-labs/dead-rose-os:${GITHUB_REF_NAME}"
          source_digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$source_digest"
          docker buildx imagetools create --tag "$production" "${candidate}@${source_digest}"
          target_digest=$(docker buildx imagetools inspect "$production" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$source_digest" = "$target_digest"
          echo "Promoted ${candidate}@${source_digest} to ${production}"
      - name: Publish exact tested ISO to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.iso }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            --verify-tag \
            --title "Dead Rose OS ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Release summary
        shell: bash
        run: |
          {
            echo '## Dead Rose OS Release'
            echo
            echo '- Version: `${{ needs.metadata.outputs.version }}`'
            echo '- Factory candidate: `ghcr.io/dead-rose-labs/dead-rose-os:candidate-${{ github.sha }}`'
            echo '- Production OCI: `ghcr.io/dead-rose-labs/dead-rose-os:${{ needs.metadata.outputs.version }}`'
            echo '- Tested ISO published without rebuilding.'
          } >> "$GITHUB_STEP_SUMMARY"
