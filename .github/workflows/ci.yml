name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt
      - name: Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: tests/integration/repository.sh

  appliance:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU UEFI tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
      - name: Build Kairos OCI image
        run: ./dr image
      - name: Verify OCI filesystem
        run: ./dr test-image
      - name: Build production ISO with AuroraBoot
        run: ./dr iso
      - name: Boot production ISO
        run: ./dr test-qemu live
      - name: Build CI auto-install ISO
        run: ./dr iso --ci
      - name: Install, boot from disk, and verify persistence
        run: ./dr test-install
      - uses: actions/upload-artifact@v4
        with:
          name: dead-rose-os-0.1.0-amd64
          path: |
            build/dead-rose-os-0.1.0-amd64.iso
            build/dead-rose-os-0.1.0-amd64.iso.sha256
          if-no-files-found: error
