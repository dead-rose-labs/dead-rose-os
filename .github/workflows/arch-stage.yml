name: Arch factory stage
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      timeout:
        required: true
        type: number
      repository:
        default: false
        type: boolean
      image:
        default: false
        type: boolean
    outputs:
      iso_name:
        value: ${{ jobs.arch.outputs.iso_name }}
      artifact_name:
        value: ${{ jobs.arch.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    outputs:
      iso_name: ${{ steps.metadata.outputs.iso_name }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: metadata
        run: ./ci/metadata.sh
      - if: inputs.repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deadrose-repo-${{ github.sha }}
          path: artifacts/
      - if: inputs.image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-image-${{ github.sha }}
          path: artifacts/
      - name: Run Arch stage
        env:
          FACTORY_STAGE: ${{ inputs.stage }}
        run: ./ci/run-arch.sh "$FACTORY_STAGE"
      - name: Package repository
        if: inputs.stage == 'build-packages'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deadrose-repo-${{ github.sha }}
          path: |
            artifacts/deadrose-repo.tar
            artifacts/deadrose-repo.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Transfer immutable ISO to inspection
        if: inputs.stage == 'build-iso'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-image-${{ github.sha }}
          path: |
            artifacts/${{ steps.metadata.outputs.iso_name }}
            artifacts/${{ steps.metadata.outputs.iso_name }}.sha256
            artifacts/manifest/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Record job outcome
        if: always()
        env:
          FACTORY_STAGE: ${{ inputs.stage }}
          FACTORY_OUTCOME: ${{ job.status }}
        run: ./ci/collect-logs.sh "$FACTORY_STAGE" "$FACTORY_OUTCOME"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-diagnostics-${{ inputs.stage }}-${{ github.sha }}
          path: |
            artifacts/logs/
            artifacts/manifest/
            artifacts/status/
          if-no-files-found: error
          retention-days: 14
