name: OS image
on:
  workflow_dispatch:

jobs:
  image:
    runs-on: [self-hosted, linux, x64, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - run: ./dr bootstrap
      - run: DEAD_ROSE_TEST_MARKERS=1 ./dr build
      - run: DEAD_ROSE_TEST_MARKERS=1 ./dr iso
      - run: ./tests/boot/installer-iso-smoke.sh build/dead-rose-os-0.1.0-amd64.iso
