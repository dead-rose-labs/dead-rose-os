[package]
name = "dead-rose-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Factory builds with Cargo directly, so packaged assets must be the default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dead-rose-ipc = { path = "../../../crates/dead-rose-ipc" }
dead-rose-types = { path = "../../../crates/dead-rose-types" }
serde_json.workspace = true
tauri = { version = "=2.11.5", features = [] }
