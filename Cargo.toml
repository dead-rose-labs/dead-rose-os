[workspace]
resolver = "2"
members = [
  "crates/dead-rose-types",
  "crates/dead-rose-ipc",
  "crates/dead-rose-core",
  "apps/shell/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
argon2 = "0.5.3"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
libc = "0.2.175"
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
uuid = { version = "1.18.0", features = ["v4", "serde"] }
