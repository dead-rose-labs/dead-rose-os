[workspace]
resolver = "2"
members = [
  "apps/installer/src-tauri",
  "apps/shell/src-tauri",
  "crates/auth",
  "crates/core",
  "crates/ipc",
  "crates/installer-core",
  "crates/system-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1.0.99"
argon2 = { version = "0.5.3", features = ["std"] }
blake3 = "1.8.2"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
hex = "0.4.3"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1.41"
tracing-journald = "0.3.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
tauri = { version = "2.8.4", default-features = false, features = ["wry"] }
nix = { version = "0.30.1", features = ["mount", "reboot"] }
