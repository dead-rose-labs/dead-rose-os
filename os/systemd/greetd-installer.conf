[Unit]
Requires=dead-rose-installer-backend.service
# Reset vendor ordering (notably plymouth-quit-wait and tty7) before defining
# the Dead Rose kiosk boot boundary. List-valued unit settings otherwise append.
After=
After=dead-rose-installer-backend.service systemd-user-sessions.service
Conflicts=
Conflicts=getty@tty1.service plymouth-quit.service plymouth-quit-wait.service
StartLimitIntervalSec=60s
StartLimitBurst=5

[Service]
Environment=DEAD_ROSE_SOFTWARE_RENDERING=1
Environment=WEBKIT_DISABLE_DMABUF_RENDERER=1
Restart=on-failure
RestartSec=5s
