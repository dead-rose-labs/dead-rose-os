[terminal]
vt = 7
switch = true

[initial_session]
command = "/usr/bin/systemd-cat --identifier=dead-rose-session --priority=info --stderr-priority=err --level-prefix=false -- /usr/bin/cage -- /opt/dead-rose/bin/dead-rose-shell"
user = "deadrose"

[default_session]
command = "/usr/sbin/agreety --cmd /bin/sh"
user = "_greetd"
