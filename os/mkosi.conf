[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe
Architecture=x86-64

[Output]
Format=disk
Output=dead-rose-os.raw
OutputDirectory=../build
CompressOutput=false

[Content]
Bootable=yes
Bootloader=grub
Packages=linux-generic
         systemd
         systemd-repart
         grub-efi-amd64
         grub-efi-amd64-bin
         grub2-common
         systemd-resolved
         dbus
         libpam-systemd
         greetd
         cage
         plymouth
         mesa-vulkan-drivers
         libgl1-mesa-dri
         ca-certificates
         procps
         libwebkit2gtk-4.1-0
         libgtk-3-0
         libayatana-appindicator3-1
ExtraTrees=mkosi.extra
KernelCommandLine=quiet splash loglevel=3 rd.systemd.show_status=false systemd.show_status=false vt.global_cursor_default=0
