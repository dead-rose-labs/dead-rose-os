insmod iso9660
insmod search_label
insmod configfile

if serial --unit=0 --speed=115200; then
  terminal_output console serial
fi

if search --no-floppy --label DEAD_ROSE_INSTALLER --set=root; then
  # Keep prefix on the standalone image's memdisk, where grub-mkstandalone
  # installed the platform modules. Only root should point at the ISO.
  configfile ($root)/boot/grub/grub.cfg
else
  echo "Dead Rose installer media (label DEAD_ROSE_INSTALLER) was not found."
fi
