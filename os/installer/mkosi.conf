[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe
Architecture=x86-64

[Output]
Format=directory
Output=installer-root
OutputDirectory=../../build
SplitArtifacts=kernel,initrd

[Content]
ExtraTrees=mkosi.extra
Locale=C.UTF-8
Timezone=UTC
Hostname=dead-rose-installer
InitrdPackages=mount
               util-linux
KernelInitrdModules=isofs
                    squashfs
                    overlay
                    loop
                    ahci
                    sr_mod
                    sd_mod
                    usb-storage
                    uas
                    xhci-pci
                    virtio_blk
                    virtio_pci
Packages=linux-generic
         systemd
         dbus
         libpam-systemd
         login
         greetd
         cage
         plymouth
         python3
         python3-apt
         python3-attr
         python3-debian
         python3-jsonschema
         python3-oauthlib
         python3-packaging
         python3-pyrsistent
         python3-pyudev
         python3-yaml
         bcache-tools
         btrfs-progs
         file
         dosfstools
         e2fsprogs
         efibootmgr
         gdisk
         lvm2
         mdadm
         parted
         rsync
         udev
         wget
         xfsprogs
         mesa-vulkan-drivers
         libgl1-mesa-dri
         zstd
         ca-certificates
         procps
         libwebkit2gtk-4.1-0
         libgtk-3-0
