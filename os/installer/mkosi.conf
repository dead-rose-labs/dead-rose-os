[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe
Architecture=x86-64

[Output]
Format=directory
Output=installer-root
OutputDirectory=../../build
SplitArtifacts=kernel,initrd

[Content]
ExtraTrees=mkosi.extra
Locale=C.UTF-8
Timezone=UTC
Hostname=dead-rose-installer
InitrdPackages=mount
               util-linux
KernelInitrdModules=isofs
                    squashfs
                    overlay
                    loop
                    ahci
                    sr_mod
                    sd_mod
                    usb-storage
                    uas
                    xhci-pci
                    virtio_blk
                    virtio_pci
Packages=linux-generic
         systemd
         dbus
         libpam-systemd
         greetd
         cage
         plymouth
         curtin
         mesa-vulkan-drivers
         libgl1-mesa-dri
         zstd
         ca-certificates
         procps
         libwebkit2gtk-4.1-0
         libgtk-3-0
