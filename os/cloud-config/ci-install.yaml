#cloud-config
install:
  device: /dev/vda
  auto: true
  nousers: true
  bind_mounts:
    - /var/lib/dead-rose
  reboot: false
  poweroff: true
stages:
  initramfs:
    - name: CI live installation has one owner
      if: '[ -f /run/cos/live_mode ]'
      only_service_manager: systemd
      files:
        - path: /run/systemd/system/greetd.service.d/ci-headless.conf
          permissions: 0644
          content: |
            [Unit]
            ConditionPathExists=!/run/cos/live_mode
        - path: /run/systemd/system/kairos-webui.service.d/ci-headless.conf
          permissions: 0644
          content: |
            [Unit]
            ConditionPathExists=!/run/cos/live_mode
  boot:
    - name: Verify CI headless installation
      if: '[ -f /run/cos/live_mode ]'
      only_service_manager: systemd
      commands:
        - |
          set -eu
          systemctl daemon-reload
          systemctl stop greetd.service kairos-webui.service
          if systemctl is-active --quiet greetd.service kairos-webui.service; then
            exit 1
          fi
          echo DEAD_ROSE_CI_HEADLESS > /dev/ttyS0
    - name: Verify installed UI and persistent data before shutdown
      if: '[ ! -f /run/cos/live_mode ] && [ -f /run/cos/active_mode ]'
      only_service_manager: systemd
      files:
        - path: /run/systemd/system/dead-rose-ci-acceptance.service
          permissions: 0644
          content: |
            [Unit]
            Description=Dead Rose CI installed boot acceptance
            After=cos-setup-boot.service dead-rose-core.service greetd.service
            Requires=dead-rose-core.service greetd.service
            ConditionPathExists=/run/cos/active_mode
            ConditionPathExists=!/run/cos/live_mode
            [Service]
            Type=oneshot
            ExecStart=/usr/bin/python3 /run/dead-rose-ci-acceptance.py
            TimeoutStartSec=300
            StandardOutput=journal+console
            StandardError=journal+console
        - path: /run/dead-rose-ci-acceptance.py
          permissions: 0600
          content: |
            import os
            from pathlib import Path
            import re
            import secrets
            import sqlite3
            import subprocess
            import time

            UI_READY = "DEAD_ROSE_UI_READY mode=first_boot"
            PAYLOAD = "dead-rose-ci-persistence-v1"

            def persist_state(directory, boot_id):
                path = directory / "ci-acceptance.db"
                first = not path.exists()
                # Existing state must be read and validated, never repaired or recreated.
                db = sqlite3.connect(path if first else path.as_uri() + "?mode=ro", uri=not first)
                try:
                    if db.execute("PRAGMA integrity_check").fetchall() != [("ok",)]:
                        raise RuntimeError("CI state database integrity check failed")
                    if first:
                        nonce = secrets.token_hex(32)
                        db.execute("PRAGMA synchronous=FULL")
                        db.execute("CREATE TABLE witness (nonce TEXT, boot_id TEXT, payload TEXT)")
                        db.execute("INSERT INTO witness VALUES (?, ?, ?)", (nonce, boot_id, PAYLOAD))
                        db.commit()
                    else:
                        rows = db.execute("SELECT nonce, boot_id, payload FROM witness").fetchall()
                        if len(rows) != 1:
                            raise RuntimeError("Expected exactly one persistence witness")
                        nonce, previous_boot, payload = rows[0]
                        if not re.fullmatch(r"[0-9a-f]{64}", nonce) or payload != PAYLOAD:
                            raise RuntimeError("Persistence witness content mismatch")
                        if previous_boot == boot_id:
                            raise RuntimeError("Persistence requires a different installed boot")
                finally:
                    db.close()
                if first:
                    fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY)
                    try:
                        os.fsync(fd)
                    finally:
                        os.close(fd)
                return ("DEAD_ROSE_CI_STATE_WRITTEN" if first else "DEAD_ROSE_PERSISTENCE_OK"), nonce

            def emit(message):
                print(message, flush=True)
                fd = os.open("/dev/ttyS0", os.O_WRONLY | os.O_NOCTTY | os.O_NONBLOCK)
                try:
                    os.write(fd, (message + "\n").encode())
                finally:
                    os.close(fd)

            def main():
                deadline = time.monotonic() + 240
                while time.monotonic() < deadline:
                    result = subprocess.run(
                        ["journalctl", "-b", "-u", "dead-rose-core.service", "--no-pager", "-o", "cat"],
                        capture_output=True, text=True, check=True, timeout=10,
                    )
                    if UI_READY in result.stdout.splitlines():
                        break
                    time.sleep(1)
                else:
                    raise RuntimeError("Installed UI did not become ready")
                # Require the graphical path still to be running when checking state.
                for unit in ("dead-rose-core.service", "greetd.service"):
                    subprocess.run(["systemctl", "is-active", "--quiet", unit], check=True, timeout=10)
                boot_id = Path("/proc/sys/kernel/random/boot_id").read_text().strip()
                marker, nonce = persist_state(Path("/var/lib/dead-rose"), boot_id)
                emit(f"{marker} nonce={nonce}")
                os.sync()
                emit("DEAD_ROSE_CI_SHUTDOWN_REQUESTED")
                subprocess.run(["systemctl", "poweroff"], check=True, timeout=10)

            if __name__ == "__main__":
                main()
      commands:
        - systemctl daemon-reload
        - systemctl start --no-block dead-rose-ci-acceptance.service
