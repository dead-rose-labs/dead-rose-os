---
dontChroot: false
timeout: 30
script:
  # removeuser upstream logs failures without failing: enforce its postcondition.
  - '! getent passwd live'
  - 'test ! -e /etc/sudoers.d/10-live && test ! -e /etc/sddm.conf.d/10-live.conf'
  - 'test ! -e /usr/bin/calamares && test ! -e /usr/share/applications/install-dead-rose.desktop'
  - 'test -s /boot/vmlinuz-linux && test -s /boot/initramfs-linux.img && test -s /boot/grub/grub.cfg'
  - 'test -s /boot/efi/EFI/DeadRose/grubx64.efi'
  - 'test -f /usr/share/wayland-sessions/plasma.desktop'
  - 'test "$(passwd -S root | cut -d " " -f2)" = L'
  - 'visudo -cf /etc/sudoers'
