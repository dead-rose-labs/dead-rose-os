---
# Configuration-only live-to-installed cleanup through upstream shellprocess.
# No partitioning, authentication or bootloader logic is implemented here.
dontChroot: false
timeout: 60
script:
  - 'rm -f /etc/sddm.conf.d/10-live.conf /etc/sudoers.d/10-live'
  - 'rm -f /etc/mkinitcpio.conf.d/archiso.conf /etc/systemd/system/graphical.target.wants/dead-rose-live-check.service /etc/systemd/system/dead-rose-live-check.service /usr/local/bin/dead-rose-live-check'
  - 'rm -f /usr/share/applications/install-dead-rose.desktop /usr/local/bin/install-dead-rose /etc/polkit-1/rules.d/49-dead-rose-live.rules'
  - 'install -m644 /usr/share/dead-rose/installed/linux.preset /etc/mkinitcpio.d/linux.preset'
  - 'install -m644 /usr/share/dead-rose/installed/mkinitcpio.conf /etc/mkinitcpio.conf'
  - 'install -m644 /usr/share/dead-rose/installed/grub /etc/default/grub'
  - 'rm -rf /etc/calamares /root/.gnupg /var/lib/NetworkManager/* /var/lib/systemd/random-seed'
