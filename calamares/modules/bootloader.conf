---
# GRUB is the standard Calamares path for Arch + Btrfs, including LUKS1.
# Live ISO uses systemd-boot; installed machines use upstream GRUB module.
efiBootLoader: grub
efiBootloaderId: DeadRose
grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr
installEFIFallback: true
