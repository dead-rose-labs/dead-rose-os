---
defaultGroups:
  - { name: wheel, must_exist: true, system: true }
sudoersGroup: wheel
sudoersConfigureWithGroup: true
autologinGroup: ''
setRootPassword: false
doAutologin: false
allowWeakPasswords: false
passwordRequirements:
  minLength: 8
user:
  shell: /bin/bash
  forbidden_names: [ root, live ]
  home_permissions: 'o700'
hostname:
  location: EtcFile
  writeHostsFile: true
  template: '${login}-deadrose'
allowActiveDirectory: false
